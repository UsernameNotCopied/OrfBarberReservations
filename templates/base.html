<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Orf Barber Reservations{% endblock %}</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-96x96.png') }}?v=20260617" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v=20260617" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}?v=20260617" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v=20260617" />
    <meta name="apple-mobile-web-app-title" content="OrfBarber Reservations" />
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}?v=20260617" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #f9fafb;
            --surface: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #111827;
            --accent-hover: #374151;
            --border: #e5e7eb;
            --danger: #ef4444;
            --success: #10b981;
            --ring: rgba(17, 24, 39, 0.15);
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text-main); }

        /* Container Layout Variants */
        .container { max-width: 480px; margin: 6vh auto 40px; background: var(--surface); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .container-sm { max-width: 400px; margin: 12vh auto 40px; text-align: center; }
        .container-lg { max-width: 900px; margin: 20px auto 40px; padding: 32px 40px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .header-simple { border-bottom: none; padding-bottom: 0; }
        h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; }

        /* Typography & Navigation Links */
        a.nav-link { color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 14px; transition: color 0.2s; }
        a.nav-link:hover { color: var(--text-main); }
        .logout { color: var(--danger); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 6px; transition: background 0.2s; }
        .logout:hover { background: #fef2f2; }
        .back-link { display: inline-block; margin-top: 16px; color: var(--text-muted); text-decoration: none; font-size: 14px; }
        .back-link:hover { color: var(--text-main); }

        /* Form Controls */
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }
        input, select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: 'Inter', sans-serif; transition: all 0.2s ease; box-sizing: border-box; background: #fff; }
        input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
        select:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
        .contact-row { display: flex; gap: 16px; }
        .flex-1 { flex: 1; }

        /* Buttons */
        .btn { background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s ease; margin-top: 8px; font-family: 'Inter', sans-serif; }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline { display: inline-block; border: 2px solid var(--border); color: var(--text-main); text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: all 0.2s ease; }
        .btn-outline:hover { border-color: var(--text-main); background: var(--bg); }
        .btn-delete { background: #fee2e2; color: #ef4444; border: 1px solid #f87171; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-delete:hover { background: #fca5a5; color: #991b1b; }
        .btn-delete.past { background: var(--bg); color: var(--text-muted); border-color: var(--border); }
        .btn-delete.past:hover { background: #fee2e2; color: #ef4444; border-color: #f87171; }

        /* Dashboard Tabs & Tables */
        .tabs { display: flex; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .tab-btn { background: none; border: none; padding: 8px 16px; font-size: 15px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .tab-btn:hover { background: var(--bg); color: var(--text-main); }
        .tab-btn.active { background: var(--accent); color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 15px; }
        th, td { padding: 16px 12px; border-bottom: 1px solid var(--border); text-align: left; }
        th { color: var(--text-muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
        tbody tr { transition: background 0.2s ease; }
        tbody tr:hover { background: #f9fafb; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 32px; font-style: italic; }

        /* Block Form Styling */
        .block-form { display: flex; gap: 12px; background: #f3f4f6; padding: 20px; border-radius: 8px; margin-bottom: 24px; align-items: flex-end; flex-wrap: wrap; }
        .block-input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; background: #fff; }
        .btn-submit { background: var(--accent); color: #fff; border: none; padding: 11px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
        .btn-submit:hover { background: var(--accent-hover); }

        /* Custom Calendar Styling */
        span.flatpickr-day { color: var(--text-main) !important; }
        span.flatpickr-day.selected { background: var(--accent) !important; border-color: var(--accent) !important; color: #ffffff !important; }
        span.flatpickr-day.flatpickr-disabled { color: #9ca3af !important; position: relative; }

        /* --- Upgraded Shop Footer --- */
        .shop-footer { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); text-align: left; }
        .footer-grid { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
        .footer-col { display: flex; flex-direction: column; gap: 6px; }
        .footer-heading { font-weight: 600; color: var(--text-main); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
        .footer-text { margin: 0; line-height: 1.5; font-size: 13px; }
        .social-links { display: flex; gap: 10px; align-items: center; }
        .social-links a { color: var(--text-muted); transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; padding: 8px; border-radius: 8px; background: #f3f4f6; border: 1px solid transparent; }
        .social-links a:hover { color: var(--text-main); background: #e5e7eb; border-color: var(--border); transform: translateY(-2px); }
        .icon-svg { width: 16px; height: 16px; }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px dashed var(--border); font-size: 12px; }
        .footer-admin-link { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.2s ease; }
        .footer-admin-link:hover { color: var(--text-main); }
        .creator-credit { margin-top: 6px; font-size: 11px; }
        .creator-credit a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.2s ease; }
        .creator-credit a:hover { color: var(--text-main); text-decoration: underline; }

        /* --- Upgraded Admin System Footer --- */
        .admin-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); text-align: left; }
        .footer-left { display: flex; align-items: center; gap: 8px; }
        .status-indicator { width: 8px; height: 8px; background-color: var(--success); border-radius: 50%; display: inline-block; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
        .admin-footer strong { color: var(--text-main); font-weight: 500; }

        /* --- Mobile Responsive Rules --- */
        @media (max-width: 768px) {
            body { padding: 12px; }
            .container, .container-sm, .container-lg { margin: 2vh auto; padding: 24px 20px; }
            .header h1 { font-size: 20px; }
            .contact-row { flex-direction: column; gap: 0; }
            .tabs { overflow-x: auto; white-space: nowrap; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
            .tabs::-webkit-scrollbar { display: none; }
            .tab-btn { flex-shrink: 0; }
            .tab-content { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px; }
            table { min-width: 650px; }
            .block-form { flex-direction: column; align-items: stretch; }
            .btn-submit { width: 100%; margin-top: 12px; }
            .footer-grid { flex-direction: column; gap: 16px; }
            .footer-col[style*="align-items: flex-end;"] { align-items: flex-start !important; }
            .footer-bottom, .admin-footer { flex-direction: column; gap: 8px; text-align: center; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}

        {% block footer %}
        <footer class="shop-footer">
            <div class="footer-grid">
                <div class="footer-col">
                    <span class="footer-heading">Orf Barber</span>
                    <p class="footer-text">Kavala, Greece</p>
                </div>
                <div class="footer-col" style="align-items: flex-end;">
                    <span class="footer-heading">Connect</span>
                    <div class="social-links">
                        <a href="https://www.instagram.com/orf_barber" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Follow on Instagram">
                            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                        </a>
                        <a href="tel:+306980302339" aria-label="Call" title="Call">
                            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        </a>
                        <a href="https://maps.app.goo.gl/Pu5R3wLGTix1Rs6f7" target="_blank" rel="noopener noreferrer" aria-label="Directions" title="Get Directions">
                            <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        </a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <div>
                    <div>© <span id="current-year"></span> Orf Barber. All rights reserved.</div>
                    <div class="creator-credit">Site by <a href="https://instagram.com/jason_evagelopoulos" target="_blank" rel="noopener noreferrer">jason_evagelopoulos</a></div>
                </div>
            </div>
        </footer>
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const yearSpan = document.getElementById('current-year') || document.getElementById('admin-year');
            if (yearSpan) yearSpan.textContent = new Date().getFullYear();
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
