<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --bg: #f9fafb; --surface: #ffffff; --text-main: #111827; --text-muted: #6b7280; --success: #10b981; --border: #e5e7eb; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text-main); }
        .container { max-width: 480px; margin: 12vh auto; background: var(--surface); padding: 48px 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        
        .icon { font-size: 48px; margin-bottom: 16px; }
        h1 { margin: 0 0 16px 0; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; color: var(--success); }
        p { margin: 0 0 32px 0; font-size: 16px; color: var(--text-muted); line-height: 1.5; }
        strong { color: var(--text-main); font-weight: 600; }
        
        .btn-outline { display: inline-block; border: 2px solid var(--border); color: var(--text-main); text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: all 0.2s ease; }
        .btn-outline:hover { border-color: var(--text-main); background: var(--bg); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎉</div>
        <h1>Appointment Confirmed!</h1>
        <p>
            Thank you, <strong>{{ name }}</strong>.<br>
            We have you down for <strong>{{ date }}</strong> at <strong>{{ time }}</strong>.<br>
            
            {% if email %}
            <span style="display: inline-block; margin-top: 12px; font-size: 14px;">We'll send a confirmation to <strong>{{ email }}</strong>.</span>
            {% endif %}
        </p>
        <a href="/" class="btn-outline">Book another appointment</a>
    </div>
</body>
</html>
