{% extends "base.html" %}

{% block title %}Appointment Confirmed! - Orf Barber{% endblock %}

{% block content %}
<div style="text-align: center; padding: 20px 0;">
    <h1 style="color: var(--success); margin-bottom: 16px;">Appointment Confirmed!</h1>
    <p style="color: var(--text-muted); font-size: 16px; line-height: 1.5; margin-bottom: 32px;">
        Thank you, <strong style="color: var(--text-main);">{{ name }}</strong>.<br>
        We have you down for <strong style="color: var(--text-main);">{{ date }}</strong> at <strong style="color: var(--text-main);">{{ time }}</strong>.
    </p>
    <a href="/" class="btn-outline">Book another appointment</a>
</div>
{% endblock %}
