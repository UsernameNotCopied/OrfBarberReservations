{% extends "base.html" %}

{% block title %}Book Your Haircut - Orf Barber{% endblock %}

{% block content %}
    <div class="header header-simple">
        <h1>Book Your Haircut</h1>
        <a href="/admin" class="nav-link">Admin Login</a>
    </div>
    <form action="/book" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required>
        </div>

        <div class="contact-row">
            <div class="form-group flex-1">
                <label for="email">Email Address <span style="color: #9ca3af; font-weight: 400; font-size: 12px;">(Optional)</span></label>
                <input type="email" id="email" name="email" placeholder="Your Email">
            </div>
            <div class="form-group flex-1">
                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Your Mobile Number" required>
            </div>
        </div>

        <div class="form-group">
            <label for="date">Select Date</label>
            <input type="text" id="date" name="date" placeholder="Choose a date first" required>
        </div>
        <div class="form-group">
            <label for="time">Select Time</label>
            <select id="time" name="time" required disabled>
                <option value="" disabled selected>Please select a date first</option>
            </select>
        </div>
        <button type="submit" class="btn">Confirm Reservation</button>
    </form>
{% endblock %}

{% block scripts %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const timeSelect = document.getElementById('time');

            flatpickr("#date", {
                minDate: "today",
                // NEW: Restrict selection to a maximum of 7 days from today
                maxDate: new Date().fp_incr(7),
                dateFormat: "Y-m-d",
                disableMobile: "true",
                onChange: function (selectedDates, dateStr, instance) {
                    timeSelect.disabled = true;
                    timeSelect.innerHTML = '<option value="" disabled selected>Loading available times...</option>';

                    fetch(`/api/available-slots?date=${dateStr}`)
                        .then(response => response.json())
                        .then(data => {
                            timeSelect.innerHTML = '<option value="" disabled selected>Choose a time slot...</option>';
                            if (data.length === 0) {
                                timeSelect.innerHTML = '<option value="" disabled selected>Fully booked for this date</option>';
                            } else {
                                data.forEach(slot => {
                                    timeSelect.innerHTML += `<option value="${slot}">${slot}</option>`;
                                });
                                timeSelect.disabled = false;
                            }
                        })
                        .catch(error => {
                            console.error("Error fetching times:", error);
                            timeSelect.innerHTML = '<option value="" disabled selected>Error loading slots</option>';
                        });
                }
            });
        });

        document.querySelector('form').addEventListener('submit', function (e) {
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const phone = document.getElementById('phone');
            const date = document.getElementById('date');
            const time = document.getElementById('time');

            const emailValue = email.value.trim();
            const phoneValue = phone.value.trim();
            const phoneDigitsOnly = phoneValue.replace(/\D/g, '');

            email.setCustomValidity('');
            phone.setCustomValidity('');

            if (emailValue && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) {
                e.preventDefault();
                email.setCustomValidity('Please enter a valid email address.');
                email.reportValidity();
                return;
            }

            if (phoneValue && (phoneDigitsOnly.length < 10 || phoneDigitsOnly.length > 15)) {
                e.preventDefault();
                phone.setCustomValidity('Please enter a valid mobile number with 10 to 15 digits.');
                phone.reportValidity();
                return;
            }

            if (!name.value.trim() || !phoneValue || !date.value.trim() || !time.value) {
                return;
            }
        });
    </script>
{% endblock %}
