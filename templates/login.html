<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Admin Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root { --bg: #f9fafb; --surface: #ffffff; --text-main: #111827; --text-muted: #6b7280; --accent: #111827; --accent-hover: #374151; --border: #e5e7eb; --ring: rgba(17, 24, 39, 0.15); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text-main); }
        .container { max-width: 400px; margin: 12vh auto; background: var(--surface); padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        h1 { margin: 0 0 24px 0; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 500; margin-bottom: 8px; color: var(--text-main); font-size: 14px; }
        input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: 'Inter', sans-serif; transition: all 0.2s ease; box-sizing: border-box; }
        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
        
        .btn { background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s ease; font-family: 'Inter', sans-serif; }
        .btn:hover { background: var(--accent-hover); }
        .footer { margin-top: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }
        .back-link { display: inline-block; margin-top: 16px; color: var(--text-muted); text-decoration: none; font-size: 14px; }
        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Login</h1>
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>
        <a href="/" class="back-link">← Back to booking</a>
        <div class="footer">© Orf Barber</div>
    </div>
</body>
</html>
